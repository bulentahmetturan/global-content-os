name = "global-content-os"
main = "apps/worker/src/index.ts"
compatibility_date = "2025-07-18"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "global-content-os"
database_id = "c0ce92dc-9842-4dd9-9d05-a8d09e798b34"
migrations_dir = "migrations"

[assets]
directory = "apps/hub"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Local secrets: copy .dev.vars.example → .dev.vars (never commit)
# Production: wrangler secret put CCOS_HANDOFF_URL / CCOS_HANDOFF_TOKEN / STATUS_CALLBACK_TOKEN / TIP_RADAR_INGEST_TOKEN

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
CCOS_HANDOFF_STUB = "true"
# Hekimler continuous ingestion (Fast Activation v1). Enabled after local migration + live dry-run.
HEKIMLER_CONTINUOUS_INGESTION_ENABLED = "true"

[ai]
binding = "AI"
