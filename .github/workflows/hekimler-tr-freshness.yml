name: Hekimler TR source freshness

# Visible alarm for runner_region=TR sources (hsgm_public_health). Reads the public Hub telemetry and fails
# (red run + GitHub e-mail) when the source has no recent success, is unhealthy, or last_success_at is stale.
# Does not fetch HSGM itself and needs no secret.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python adapters/hekimler-radar/scripts/hekimler_tr_freshness.py --max-age-hours 48
