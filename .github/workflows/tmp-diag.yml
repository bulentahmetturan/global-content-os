name: tmp-diag
on:
  push:
    branches: [diag/release-gate]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install -r adapters/tip-toplulugu-radar/requirements-test.txt
      - run: node --test release/test/release.test.mjs 2>&1 | grep -E "FAIL \[|READINESS|why:|next:" | head -40 || true
      - run: node --test apps/worker/src/statistics/local-runtime.test.mjs 2>&1 | grep -vE "^\s+at " | tail -60 || true
      - run: node --test apps/worker/src/statistics/readers/eurostat-worker-e2e.test.mjs 2>&1 | grep -vE "^\s+at " | tail -40 || true
