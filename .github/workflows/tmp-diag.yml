name: tmp-diag
on:
  push:
    branches: [diag/release-gate]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install -r adapters/tip-toplulugu-radar/requirements-test.txt
      - run: timeout 600 node --test apps/worker/src/statistics/local-runtime.test.mjs > /tmp/a.log 2>&1; echo exit=$?; grep -vE "^\s+at " /tmp/a.log | tail -50
      - run: timeout 600 node --test apps/worker/src/statistics/readers/eurostat-worker-e2e.test.mjs > /tmp/b.log 2>&1; echo exit=$?; grep -vE "^\s+at " /tmp/b.log | tail -50
