name: Worker tests

# Production-readiness audit (2026-09-27) finding: there was no CI workflow
# at all for apps/worker -- typecheck, the *.test.mjs suite, and the Bible
# v4 / S57 / S63 invariants in scripts/production-check.mjs only ever ran
# locally, never gated a push or PR. This closes that gap. python3 with
# pytest is required for production-check.mjs's own pytest step (see
# adapters/tip-toplulugu-radar/requirements-test.txt, installed here too so the
# same command behaves identically to a local run).
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "adapters/**"
      - "packages/**"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - "tsconfig.base.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/**"
      - "adapters/**"
      - "packages/**"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - "tsconfig.base.json"
      - ".github/workflows/**"

# Package 5: path filters cover everything that can change operational behavior (Python runner/scheduler under
# adapters/**, contracts under packages/**, config/**, wrangler.toml, workflows) so validation is never silently
# skipped; docs-only commits still skip. production:check also runs scripts/ops-invariants.test.mjs, the
# scheduler simulation matrix (pytest), auth fail-closed tests and the readiness/schema drift guard.

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Several *.test.mjs files do `await import('./foo.ts')` directly,
          # relying on Node's native TypeScript type-stripping (stable by
          # default since Node 23.6/24, not present in Node 20) -- this must
          # match whatever Node version development/production-check.mjs is
          # actually verified against locally.
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adapters/tip-toplulugu-radar/requirements-test.txt
      - run: python -m pip install --disable-pip-version-check -r adapters/tip-toplulugu-radar/requirements-test.txt
      - name: production:check (typecheck + worker tests + pytest + Bible/S57/S63 + ops invariants)
        run: |
          mkdir -p .logs
          npm run production:check 2>&1 | tee .logs/production-check.log
          exit "${PIPESTATUS[0]}"
      - name: Source catalog (typecheck + vitest) and router links
        run: |
          npm run typecheck:catalog 2>&1 | tee .logs/catalog-typecheck.log; test "${PIPESTATUS[0]}" -eq 0
          npm run test:catalog 2>&1 | tee .logs/catalog-tests.log | tail -8; test "${PIPESTATUS[0]}" -eq 0
          if grep -E "Tests .*(skipped|todo)" .logs/catalog-tests.log; then echo "UNEXPECTED_TEST_SKIPS (catalog)"; exit 1; fi
          node scripts/check-router-links.mjs | tee .logs/router.txt
          grep -q "^BROKEN_ROUTER_LINKS=0" .logs/router.txt && grep -q "^TRANSITIONAL_MCD_ROUTES=0" .logs/router.txt
      - name: Summary (test counts incl. skipped)
        run: |
          grep -E "SKIPPED_TESTS=|pytest --|^Summary:" .logs/production-check.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Test Files|Tests " .logs/catalog-tests.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload full log (kept out of agent/PR context)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-check-log
          path: .logs/
          retention-days: 14
