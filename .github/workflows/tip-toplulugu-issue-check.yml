name: Tıp Topluluğu sorun tespit listesi

# Daily read-only check of the production Hub against content/SORUN-TESPIT-LISTESI.md.
# Red run (GitHub e-mail) when any internal check FAILs; external blockers (HSGM, GMC, ECFMG, MiG) do not fail it.

on:
  workflow_dispatch:
  schedule:
    - cron: "27 7 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python adapters/tip-toplulugu-radar/scripts/tip_toplulugu_issue_check.py
