name: Tıp Topluluğu Python source runner

# Production scheduler for the Tıp Topluluğu sources that do not fit the Cloudflare Workers Free CPU budget
# (execution: python_runner). Each source runs in its own process with a hard timeout and bounded retry;
# one failing source never fails the batch. Results are ingested through the authenticated Hub endpoints.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "all-python | all | comma-separated source ids"
        required: false
        default: "all-python"
      timeout:
        description: "Per-source timeout in seconds"
        required: false
        default: "240"
      retries:
        description: "Retries per source on transient failures"
        required: false
        default: "2"
      dry_run:
        description: "Dry run (no ingest)"
        required: false
        type: boolean
        default: false
      force_due:
        description: "Ignore per-source interval and run every AUTOMATION_READY source (backfill/manual use)"
        required: false
        type: boolean
        default: false
      lane:
        description: "Hub lane that triggered this run (duyuru|burs|egitim); only used to keep lanes from cancelling each other"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC

permissions:
  contents: read

concurrency:
  # One run at a time per lane (and one for the scheduled full run). Before: a single group, so a manual run for another
  # lane queued behind a running one was cancelled when a third arrived (only one run can be pending per group).
  group: tip-toplulugu-python-runner-${{ github.event.inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: adapters/tip-toplulugu-radar
    env:
      GCOS_HUB_URL: https://global-content-os.channel-content-os-mcp.workers.dev
      TIP_TOPLULUGU_CONTINUOUS_INGESTION_ENABLED: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adapters/tip-toplulugu-radar/requirements-runner.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runner.txt

      - name: Run sources
        env:
          TIP_RADAR_INGEST_TOKEN: ${{ secrets.TIP_RADAR_INGEST_TOKEN }}
          SOURCES: ${{ github.event.inputs.sources || 'all-python' }}
          SOURCE_TIMEOUT: ${{ github.event.inputs.timeout || '240' }}
          SOURCE_RETRIES: ${{ github.event.inputs.retries || '2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_DUE: ${{ github.event.inputs.force_due || 'false' }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$FORCE_DUE" = "true" ]; then EXTRA="$EXTRA --force-due"; fi
          python scripts/tip_toplulugu_scheduled_run.py \
            --sources "$SOURCES" --timeout "$SOURCE_TIMEOUT" --retries "$SOURCE_RETRIES" \
            --report-dir report $EXTRA

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tip-toplulugu-run-report
          path: adapters/tip-toplulugu-radar/report/
          retention-days: 30
