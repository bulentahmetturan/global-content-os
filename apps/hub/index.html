  .pill {
    font: inherit; font-weight: 600; font-size: .82rem; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .pill.active { background: var(--navy); color: #fff; border-color: transparent; }
  .pill .p-count {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem;

  }
  .pill.active .p-count { background: rgba(255,255,255,.25); }
  .lane-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 18px; font-size: .82rem; color: var(--text-dim); box-shadow: var(--shadow);
  }
  .lane-note b { color: var(--text); }
  .lane-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turquoise); margin-top: 6px; flex-shrink: 0; }
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; transition: opacity .35s ease, transform .35s ease;
  }
  .card.leaving { opacity: 0; transform: scale(.97); }
  .card.in-production { border-left: 3px solid var(--ok); }
  .card.in-done { border-left: 3px solid var(--turquoise); opacity: .92; }
  .card.in-trash { border-left: 3px solid var(--danger); opacity: .8; }
  .card.in-hold { border-left: 3px solid var(--hold); }

    display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem; color: var(--text-faint); margin-bottom: 8px; flex-wrap: wrap;

  .status-pill.production { background: var(--ok-bg); color: var(--ok); }
  .status-pill.done { background: #E6F7FA; color: #0B6B7A; }
  .status-pill.trash { background: var(--danger-bg); color: var(--danger); }
  .status-pill.hold { background: var(--hold-bg); color: var(--hold); }
  .card-title { font-size: .95rem; font-weight: 600; line-height: 1.35; margin: 0 0 3px; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--blue); text-decoration: underline; }
  .original-title { font-size: .72rem; color: var(--text-faint); font-style: italic; margin: 0 0 8px; line-height: 1.4; }
  .gist {
    font-size: .87rem; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px;
    padding-left: 10px; border-left: 2px solid var(--turquoise);
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .78rem; font-weight: 600; border-radius: 8px; padding: 7px 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;

  .btn-promote { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .btn-delete { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .btn-undo { background: var(--surface); color: var(--blue); }
  .btn-hold { background: var(--hold-bg); color: var(--hold); border-color: transparent; }
  .btn-sync { background: var(--navy); color: #fff; border-color: transparent; }
  .empty {
    text-align: center; color: var(--text-faint); font-size: .85rem; padding: 30px 10px;
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff;
    font-size: .82rem; font-weight: 600; padding: 10px 18px; border-radius: 30px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footnote {
    margin-top: 26px; font-size: .74rem; color: var(--text-faint); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }

    .project-nav { flex-direction: row; gap: 6px; }
    .project-item { white-space: nowrap; }
    .main { padding: 16px 16px 40px; }
  }

  .src-link:hover{color:var(--accent,#39b8d4)}

  .bible-doc { font-size: .92rem; line-height: 1.65; color: var(--text); }

  .bible-doc pre {

  .bible-doc :not(pre) > code {

  .bible-doc table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: 12px 0 18px; }
  .bible-doc th, .bible-doc td { border: 1px solid var(--border); padding: 7px 9px; vertical-align: top; }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function stripHtml(s) {
    var t = String(s == null ? '' : s);
    t = t.replace(/<[^>]+>/g, ' ');
    t = t.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
      .replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#(\d+);/g, function (_, n) {
        return String.fromCharCode(Number(n));
      }).replace(/&#x([0-9a-f]+);/gi, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      });
    return t.replace(/\s+/g, ' ').trim();
  }

  /** Calendar-day age vs today (local). "bugün" / "1 gün" / "N gün". Recalculated on every render. */
  function formatNewsAge(iso, fallbackIso) {
    var raw = iso || fallbackIso;
    if (!raw) return '';
    var d = new Date(raw);
    if (isNaN(d.getTime())) {
      if (fallbackIso && fallbackIso !== iso) return formatNewsAge(fallbackIso, null);
      return '';
    }
    var now = new Date();
    var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var startNews = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var days = Math.round((startToday - startNews) / 86400000);
    // Absurd / broken source dates (e.g. Google News epoch junk) → fallback or hide
    if (days > 800 || days < -30) {
      if (fallbackIso && fallbackIso !== iso) return formatNewsAge(fallbackIso, null);
      return '';
    }
    if (days < 0) days = 0;
    if (days === 0) return 'bugün';
    if (days === 1) return '1 gün';
    return days + ' gün';
  }

        if (!entered || !entered.trim()) return null;

        return entered.trim();
      }).then(function (t) { tokenPrompt = null; return t; }, function (e) { tokenPrompt = null; throw e; });
    }
    return tokenPrompt;
  }

  async function api(path, opts) {
    // Every Hub write (triage, source sync) is gated server-side on the operator token.
    var needsOperator = !!(opts && opts.method && opts.method !== 'GET');
    for (var attempt = 0; attempt < 2; attempt++) {
      var headers = { 'Content-Type': 'application/json' };
      var token = needsOperator ? localStorage.getItem(OPERATOR_TOKEN_KEY) : null;
      if (token) headers.Authorization = 'Bearer ' + token;
      var res = await fetch(path, Object.assign({ headers: headers }, opts || {}));
      var data = await res.json().catch(function () { return {}; });
      if (needsOperator && res.status === 401 && attempt === 0) {

        if (localStorage.getItem(OPERATOR_TOKEN_KEY) !== token) continue;
        var entered = await askOperatorToken();

      }
      if (!res.ok) { var err = new Error(data.error || ('HTTP ' + res.status)); err.status = res.status; err.data = data; throw err; }

    }

   * bug summed kaduse-news + kaduse-research's enabledFeeds regardless of

   * apps/hub/route-counts.test.mjs for the regression test.

  function computeActiveSourceCount(state, bursCatalog, egitimCatalog) {
    if (state.route === 'tip_toplulugu' && state.hekSources) {
      if (state.hekLane === 'burs') {
        return bursCatalog.length || state.hekSources.filter(function (s) { return sourceFamily(s) === 'burs'; }).length;
      }
      if (state.hekLane === 'egitim') {
        return egitimCatalog.length || state.hekSources.filter(function (s) { return sourceFamily(s) === 'egitim'; }).length;

  function sourceNeedsReview(row, revalidationBySource) {

      } else {
        el.innerHTML = '<b>' + kaduseNews.length + ' haber kaynağı</b> · satıra tıklayınca liste o kaynağa süzülür ' + filt + reviewToggle + lifecycleFilterEl +
          '<h3>📰 Haber (' + kaduseNews.length + ')</h3>' + (kaduseNews.length ? table(kaduseNews) : '<div>Yok</div>');
      }
      return;
    }
    el.innerHTML = '<b>' + news.length + ' duyuru kaynağı</b> · satıra tıklayınca liste o kaynağa süzülür ' + filt + reviewToggle + lifecycleFilterEl +
      '<h3>🩺 Duyuru (' + news.length + ')</h3>' + (news.length ? table(news) : '<div>Yok</div>');
  }
  async function ensureFeeds() {
    if (state.route === 'tip_toplulugu' || state.feedsByRoute[state.route]) return;
    if (state.route === 'kaduse') {
      var both = await Promise.all([api('/api/feeds?route=kaduse-news'), api('/api/feeds?route=kaduse-research')]);
      state.feedsByRoute.kaduse = (both[0].feeds || []).concat(both[1].feeds || []);
      return;
    }
    var d = await api('/api/feeds?route=' + encodeURIComponent(state.route));
    state.feedsByRoute[state.route] = d.feeds || [];
  }

  var COVERAGE_TR = {
    PIPELINE_OK: 'Active · Çekim açık', PIPELINE_OK_EMPTY: 'Çalışıyor, içerik yok', PIPELINE_OK_LIMITED: 'Sınırlı kapsam',
    PARTIALLY_COVERED: 'Kısmen kapsanıyor', RUNNER_REQUIRED: 'Türkiye runner gerekli',
    CONFIGURED_NOT_WIRED: 'Configured · Bağlantı kurulmamış (bot koruması)',
    FAILED_INTERNAL: 'Hata', NOT_RUN: 'Çalışmadı'
  };
  function visibleItems() {
    return state.items.filter(function (it) { return !state.sourceFilter || it.sourceId === state.sourceFilter || it.feedId === state.sourceFilter; });
  }
  function renderToolbar() {
    var el = document.getElementById('hekToolbar');
    if (state.route !== 'tip_toplulugu') { el.hidden = true; return; }
    if ((state.hekLane === 'burs' || state.hekLane === 'egitim') && !state.items.length) { el.hidden = true; return; }
    el.hidden = false;
    var ids = {};
    state.items.forEach(function (it) { if (it.sourceId) ids[it.sourceId] = (ids[it.sourceId] || 0) + 1; });
    var opts = '<option value="">Tüm kaynaklar (' + state.items.length + ')</option>' + Object.keys(ids).sort().map(function (id) {
      return '<option value="' + escapeHtml(id) + '"' + (state.sourceFilter === id ? ' selected' : '') + '>' +
        escapeHtml(SOURCE_LABELS[id] || id.replace(/_/g, ' ')) + ' (' + ids[id] + ')</option>';
    }).join('');
    var n = Object.keys(state.selected).length;
    var health = '';
    if (state.hekSources) {
      var healthSources = state.hekSources.filter(function (s) {
        var fam = sourceFamily(s);
        if (state.hekLane === 'burs') return fam === 'burs';
        if (state.hekLane === 'egitim') return fam === 'egitim';
        return fam === 'duyuru';
      });
      health = '<details class="hek-health"><summary>Kaynak durumu (' + healthSources.length + ')</summary><table><tbody>' +
        healthSources.map(function (s) {
          var fam = sourceFamily(s);
          return '<tr><td>' + escapeHtml(SOURCE_LABELS[s.sourceId] || s.sourceId) + '</td><td>' +
            escapeHtml((fam === 'burs' || fam === 'egitim') ? 'kayıtlı · MANUAL_INTAKE (otomatik çekim kapalı, doğrulama bekliyor)' : (COVERAGE_TR[s.label] || s.label)) +
            '</td><td>' + escapeHtml(s.note || '') + '</td></tr>';
        }).join('') + '</tbody></table></details>';
    }
    el.innerHTML = '<div class="hek-bar"><select id="hekSourceFilter">' + opts + '</select>' +
      (state.view === 'inbox' || state.view === 'hold'
        ? '<button class="btn btn-hold" data-bulk="hold"' + (n ? '' : ' disabled') + '>⏳ Seçilenleri beklet (' + n + ')</button>' +
          '<button class="btn btn-delete" data-bulk="delete"' + (n ? '' : ' disabled') + '>✕ Seçilenleri sil (' + n + ')</button>' : '') +
      '</div>' + health;
  }
  function renderList() {
    var items = visibleItems();
    cardListEl.innerHTML = items.map(cardHtml).join('');
    emptyStateEl.hidden = items.length > 0;
    if (!items.length) {
      var inboxN = (state.counts && state.counts.inbox) || 0;
      if (state.hekLane === 'burs') {
        emptyStateEl.innerHTML = 'Gelen kutusunda henüz burs ilanı yok. İzlenen kaynaklar üstteki “aktif kaynak” listesindedir; buraya yalnız çekilen çağrılar düşer.';
      } else if (state.hekLane === 'egitim') {
        emptyStateEl.innerHTML = 'Gelen kutusunda henüz eğitim ilanı yok. İzlenen kaynaklar üstteki “aktif kaynak” listesindedir; buraya yalnız çekilen kurs/ilanlar düşer.';
      } else {
        emptyStateEl.innerHTML = state.view !== 'inbox' && inboxN
          ? 'Bu kutuda öğe yok. <a href="#" data-view="inbox">Gelen Kutusu’nda ' + inboxN + ' öğe var →</a>'
          : 'Bu kutuda öğe yok.';
      }
    }
    renderToolbar();
    renderSourcePanel();
  }

  async function refreshRouteCounts() {
    var data = await api('/api/routes');
    state.routeCounts = {};
    state.routeMeta = {};
    (data.routes || []).forEach(function (r) {
      state.routeCounts[r.id] = r.counts;
      state.routeMeta[r.id] = r;
    });
  }

  function loadMarked() {
    return new Promise(function (resolve, reject) {
      if (window.marked) return resolve();
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  async function renderBible() {
    var el = document.getElementById('bibleDoc');
    var metaEl = document.getElementById('bibleMeta');
    try {
      await loadMarked();
      if (!state.bibleMd) {
        var r = await fetch('/00_TURK_TIP_CONTENT_OS_BIBLE_v4.md');
        if (!r.ok) throw new Error('Bible dosyası yüklenemedi (' + r.status + ')');
        state.bibleMd = await r.text();
      }
      if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });
      el.innerHTML = window.marked.parse(state.bibleMd);
      try {
        var meta = await api('/api/bible');
        var spf = await api('/api/source-pass-fail?limit=8');
        var tracks = meta.evaluationTracks || {};
        var chips = Object.keys(tracks).map(function (k) {
          return '<span class="spf-chip">' + escapeHtml(k) + ' → ' + escapeHtml(tracks[k]) + '</span>';
        }).join('');
        var rows = (spf.decisions || []).slice(0, 8).map(function (d) {
          return '<tr><td>' + escapeHtml(d.source_id) + '</td><td>' + escapeHtml(d.editorial_decision) + '</td><td>' +
            escapeHtml(d.lifecycle_status || '') + '</td><td>' + escapeHtml((d.review_trigger || '').toString().slice(0, 80)) + '</td></tr>';
        }).join('');
        var table = rows
          ? '<table><thead><tr><th>Kaynak</th><th>Editorial</th><th>Lifecycle</th><th>Trigger</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p style="margin:8px 0 0">Henüz SPF geri besleme kaydı yok. Fetch sağlığı düşünce CONDITIONAL + degraded yazılır; FAIL değildir.</p>';
        if (metaEl) {
          metaEl.innerHTML = '<b>Bible v' + escapeHtml(meta.bibleVersion || '4.0') + '</b> · ' +
            escapeHtml(meta.rulesetVersion || 'source-pass-fail-v1') +
            ' · eşikler Config’te · FAIL yalnız hard FAIL' +
            '<div class="spf-tracks">' + chips + '</div>' + table;
        }
      } catch (metaErr) {
        if (metaEl) {
          metaEl.innerHTML = '<b>Bible v4.0</b> · Haber/Research = ENGAGEMENT · Duyuru/Burs/Eğitim = PRAGMATIC_UTILITY';
        }
      }
    } catch (err) {
      if (state.bibleMd) {
        el.innerHTML = '<pre>' + escapeHtml(state.bibleMd) + '</pre>';
      } else {
        el.innerHTML = '<p>Bible yüklenemedi. <a href="/00_TURK_TIP_CONTENT_OS_BIBLE_v4.md">Ham dosyayı aç</a>.</p><p>' + escapeHtml(err.message || err) + '</p>';
      }
    }
  }

  async function load() {
    renderChrome();
    if (state.route === 'bible') {
      await renderBible();
      return;
    }
    var days = state.route === 'tip-ogrencileri' ? 2 : 14;
    var limit = state.route === 'tip-ogrencileri' ? 100 : 200;
    var data = await api(itemsQuery(backendRoute(), state.view, days, limit));
    state.counts = data.counts || state.counts;
    state.items = data.items || [];
    state.selected = {};
    if (state.showSources) {
      try { await ensureFeeds(); } catch (e) { /* panel shows loading */ }
      try {
        var reval = await api('/api/source-revalidation');
        var bySource = {};
        (reval.requiresRevalidation || []).forEach(function (r) { bySource[r.canonical_source_key] = r; });
        state.revalidationBySource = bySource;
      } catch (e) {
        // Endpoint may not be deployed yet, or D1 migration 0024 not applied --
        // panel must still render normally without a "Doğrulama" verdict.
        state.revalidationBySource = {};
      }
    }
    if (state.route === 'tip_toplulugu') {
      try { state.hekSources = mergeHekSources((await api('/api/tip_toplulugu/sources')).sources || []); } catch (e) { state.hekSources = mergeHekSources([]); }
      if (state.hekLane === 'burs' || state.hekLane === 'egitim') { await loadLaneCatalogs(); }
    }
    await refreshRouteCounts();
    renderChrome();
    renderList();
  }

  /** Resolves {reasonCode, reasonNote} or null if the operator cancels. Every
   * reject (action === 'delete') requires a reason -- S63 feedback loop. */
  function promptRejectReason() {
    return new Promise(function (resolve) {
      var dlg = document.getElementById('rejectDialog');
      var select = document.getElementById('rejectReasonCode');
      var note = document.getElementById('rejectReasonNote');
      select.value = 'off_topic';
      note.value = '';
      function onCancel() { cleanup(); resolve(null); }
      function onSubmit(e) {
        e.preventDefault();
        var reasonCode = select.value;
        var reasonNote = note.value.trim();
        cleanup();
        dlg.close();
        resolve({ reasonCode: reasonCode, reasonNote: reasonNote || null });
      }
      function cleanup() {
        document.getElementById('rejectCancelBtn').removeEventListener('click', onCancel);
        dlg.querySelector('form').removeEventListener('submit', onSubmit);
      }
      document.getElementById('rejectCancelBtn').addEventListener('click', onCancel);
      dlg.querySelector('form').addEventListener('submit', onSubmit);
      dlg.showModal();
    });
  }

  async function handleAction(action, id) {
    var feedback = null;
    if (action === 'delete') {
      feedback = await promptRejectReason();
      if (!feedback) return; // operator cancelled -- no state change, no partial reject
    }
    var card = document.getElementById('card-' + id);
    if (card) card.classList.add('leaving');
    await new Promise(function (r) { setTimeout(r, 180); });
    var body = { itemId: id, action: action };
    if (feedback) { body.reasonCode = feedback.reasonCode; body.reasonNote = feedback.reasonNote; }
    var result = await api('/api/triage', { method: 'POST', body: JSON.stringify(body) });
    var msg =
      action === 'promote' ? '✓ Üretime aktarıldı — approved_brief üretildi' :
      action === 'hold' ? '⏳ Beklemede’ye alındı' :
      action === 'complete' ? '✓ Üretim bitti — Üretimi Bitenler’e taşındı (2 gün sonra kalıcı silinir)' :
      action === 'delete' ? 'Reddedildi — bu red kararı geri besleme olarak kaydedildi (2 gün sonra kalıcı silinir)' :
      'Gelen Kutusu’na taşındı';
    if (result.brief) msg += ' (' + result.brief.briefId + ')';
    showToast(msg);
    await load();
  }

  async function handleBulk(action) {
    var ids = Object.keys(state.selected);
    if (!ids.length) return;
    var feedback = null;
    if (action === 'delete') {
      feedback = await promptRejectReason();
      if (!feedback) return; // operator cancelled -- no items touched
    }
    var ok = 0, failed = [];
    for (var i = 0; i < ids.length; i++) {
      var body = { itemId: ids[i], action: action };
      if (feedback) { body.reasonCode = feedback.reasonCode; body.reasonNote = feedback.reasonNote; }
      try { await api('/api/triage', { method: 'POST', body: JSON.stringify(body) }); ok++; }
      catch (e) { failed.push(ids[i] + ': ' + e.message); }
    }
    showToast((action === 'hold' ? 'Beklemeye alındı: ' : 'Reddedildi (geri besleme kaydedildi): ') + ok + '/' + ids.length + (failed.length ? ' · hata: ' + failed[0] : ''));
    await load();
  }
  document.addEventListener('change', function (e) {
    if (e.target.id === 'hekSourceFilter') { state.sourceFilter = e.target.value; renderList(); return; }
    var pick = e.target.getAttribute && e.target.getAttribute('data-pick');
    if (pick) { if (e.target.checked) state.selected[pick] = true; else delete state.selected[pick]; renderToolbar(); }
    if (e.target.hasAttribute && e.target.hasAttribute('data-src-review-toggle')) {
      state.onlyNeedsReview = e.target.checked;
      renderSourcePanel();
    }
    if (e.target.hasAttribute && e.target.hasAttribute('data-src-lifecycle-filter')) {
      state.lifecycleFilter = e.target.value;
      renderSourcePanel();
    }
  });
  document.addEventListener('click', function (e) {
    var sel = window.getSelection();
    if (sel && String(sel).length > 0 && e.target.closest('#srcPanel')) { return; }
    if (e.target.closest('[data-srcpanel]')) {
      state.showSources = !state.showSources;
      renderChrome();
      ensureFeeds().catch(function () {}).then(function () { renderSourcePanel(); });
      return;
    }
    var kindBtn = e.target.closest('[data-kind]');
    if (kindBtn) {
      state.kind = kindBtn.getAttribute('data-kind');
      state.sourceFilter = '';
      localStorage.setItem('gcos-kind', state.kind);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var hekLaneBtn = e.target.closest('[data-hek-lane]');
    if (hekLaneBtn) {
      state.hekLane = hekLaneBtn.getAttribute('data-hek-lane');
      if (state.hekLane === 'all') state.hekLane = 'duyuru';
      state.sourceFilter = '';
      state.showSources = state.hekLane === 'burs' || state.hekLane === 'egitim';
      localStorage.setItem('gcos-hek-lane', state.hekLane);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var srcRow = e.target.closest('[data-src]');
    if (srcRow) {
      if (e.target.closest('a')) return;
      var want = srcRow.getAttribute('data-kind-of');
      var wantKind = want === 'kaduse-research' ? 'research' : want === 'kaduse-news' ? 'news' : null;
      state.sourceFilter = srcRow.getAttribute('data-src');
      if (state.route === 'kaduse' && wantKind && wantKind !== state.kind) {
        state.kind = wantKind;
        localStorage.setItem('gcos-kind', state.kind);
        load().catch(function (err) { showToast(err.message); });
        return;
      }
      renderList(); renderChrome(); return;
    }
    if (e.target.closest('[data-src-clear]')) { state.sourceFilter = ''; renderList(); renderChrome(); return; }
    var bulkBtn = e.target.closest('[data-bulk]');
    if (bulkBtn) { handleBulk(bulkBtn.getAttribute('data-bulk')).catch(function (err) { showToast(err.message); }); return; }
    var navBtn = e.target.closest('[data-nav]');
    if (navBtn) {
      var navId = navBtn.getAttribute('data-nav');
      var n = NAV.filter(function (x) { return x.navId === navId; })[0];
      if (!n) return;
      state.route = n.route;
      if (n.kind) state.kind = n.kind;
      state.hekLane = n.lane || (n.route === 'tip_toplulugu' ? 'duyuru' : state.hekLane);
      state.view = 'inbox';
      state.sourceFilter = '';
      state.showSources = n.lane === 'burs' || n.lane === 'egitim';
      localStorage.setItem('gcos-route', state.route);
      localStorage.setItem('gcos-hek-lane', state.hekLane);
      localStorage.setItem('gcos-kind', state.kind);
      localStorage.setItem('gcos-view', state.view);
      var url = '/?route=' + encodeURIComponent(n.route);
      if (n.route === 'bible') url = '/?route=bible';
      else if (n.route === 'kaduse' && n.kind === 'news') url = '/?route=kaduse-news';
      else if (n.route === 'kaduse' && n.kind === 'research') url = '/?route=kaduse-research';
      else if (n.route === 'tip_toplulugu') url = '/?route=tip_toplulugu&lane=' + encodeURIComponent(n.lane || 'duyuru');
      history.replaceState(null, '', url);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var routeBtn = e.target.closest('[data-route]');
    if (routeBtn) {
      state.route = routeBtn.getAttribute('data-route');
      state.view = 'inbox';
      state.sourceFilter = '';
      state.showSources = false;
      localStorage.setItem('gcos-route', state.route);
      localStorage.setItem('gcos-kind', state.kind);
      localStorage.setItem('gcos-view', state.view);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var viewBtn = e.target.closest('[data-view]');
    if (viewBtn) {
      state.view = viewBtn.getAttribute('data-view');
      localStorage.setItem('gcos-view', state.view);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      handleAction(actionBtn.getAttribute('data-action'), actionBtn.getAttribute('data-id'))
        .catch(function (err) { showToast(err.message); });
      return;
    }
  });

  // "Kaynakları çek" is lane-aware: each lane triggers ONLY its own acquisition path, and any failed
  // request is named in the toast (a partial failure is never reported as success).
  function syncPlan() {
    if (state.route === 'kaduse' && state.kind === 'research') {
      return [
        { name: 'Research API', path: '/api/ingress/research', body: null },
        { name: 'Research kaynakları', path: '/api/ingress/generic', body: { route: 'kaduse-research', offset: 0, limit: 10 } }
      ];
    }
    if (state.route === 'kaduse') {
      return [
        { name: 'WHO haber', path: '/api/ingress/news', body: null },
        { name: 'Haber kaynakları', path: '/api/ingress/generic', body: { route: 'kaduse-news', offset: 0, limit: 10 } }
      ];
    }
    if (state.route === 'tip_toplulugu') {
      var lane = state.hekLane === 'burs' || state.hekLane === 'egitim' ? state.hekLane : 'duyuru';
      return [{ name: 'Tıp Topluluğu ' + lane + ' (GitHub runner)', path: '/api/ingress/tip-toplulugu-run', body: { lane: lane } }];
    }
    return [];
  }

  document.getElementById('btnSync').addEventListener('click', function () {
    var plan = syncPlan();
    if (!plan.length) { showToast('Bu sayfada çekilecek kaynak yok.'); return; }
    showToast('Kaynaklar taranıyor… (Haber/Research yaklaşık 30-40 sn sürebilir)');
    Promise.allSettled(plan.map(function (c) {
      return api(c.path, { method: 'POST', body: c.body ? JSON.stringify(c.body) : undefined });
    })).then(function (results) {
      var failed = [];
      var created = 0;
      var notes = [];
      results.forEach(function (r, i) {
        if (r.status === 'rejected') {
          var e = r.reason || {};
          failed.push(plan[i].name + ': ' + (e.message || 'hata'));
          return;
        }
        (function sum(o) {
          if (!o || typeof o !== 'object') return;
          if (typeof o.created === 'number') created += o.created;
          Object.keys(o).forEach(function (k) { if (o[k] && typeof o[k] === 'object') sum(o[k]); });
        })(r.value);
        if (r.value && r.value.dispatched === true) notes.push(plan[i].name + ': ' + r.value.sources + ' kaynak için çalışma başlatıldı; sonuç birkaç dakika içinde gelen kutusuna düşer.');
        if (r.value && r.value.dispatched === false) notes.push(plan[i].name + ': ' + (r.value.reason || 'çalıştırılacak kaynak yok'));
      });
      var msg = failed.length
        ? 'HATA — ' + failed.length + '/' + plan.length + ' istek başarısız: ' + failed.join(' | ')
        : 'Senkron tamam: ' + plan.length + '/' + plan.length + ' istek' + (created ? ' · ' + created + ' yeni kayıt' : '') + (notes.length ? ' · ' + notes.join(' ') : ' · (yeni kayıt yoksa kaynaklarda yeni içerik yok)');
      showToast(msg);
      return load();
    }).catch(function (err) { showToast(err.message); });
  });

  load().catch(function (err) {
    showToast('API hazır değil: ' + err.message);
    renderChrome();
  });
})();
</script>
