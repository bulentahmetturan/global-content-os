<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Hub — Global Content OS</title>
<style>
  :root {
    --font-ui: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --bg: #141118; --surface: #1C1824; --surface-2: #262031;
    --sidebar-bg: #0F0D14; --sidebar-text: #CFC8DA; --sidebar-text-dim: #8B8299; --sidebar-active: #231E2E; --sidebar-border: rgba(255,255,255,.10);
    --border: #2E2839; --text: #F2EDE6; --text-dim: #B6ADC2; --text-faint: #8A8199;
    --accent: #F2C14E; --on-accent: #1B1405; --navy: #F2C14E; --on-navy: #1B1405; --blue: #F2C14E; --turquoise: #F2C14E;
    --select-bg: #EFE6D2; --select-ink: #1E1A12; --select-dim: #5B523F;
    --ok: #5BD39A; --ok-bg: #153024; --hold: #E8B04B; --hold-bg: #33290F; --danger: #F1766A; --danger-bg: #3A1A18;
    --shadow: 0 1px 2px rgba(0,0,0,.40), 0 12px 32px rgba(0,0,0,.30);
    --radius: 12px; --sidebar-w: 248px;
  }
  :root[data-theme="light"] {
    --bg: #F2F2EF; --surface: #FFFFFF; --surface-2: #E9E9E5;
    --sidebar-bg: #121212; --sidebar-text: #DADAD6; --sidebar-text-dim: #8F8F8A; --sidebar-active: #242424; --sidebar-border: rgba(255,255,255,.12);
    --border: #D6D6D1; --text: #141414; --text-dim: #4A4A46; --text-faint: #75756F;
    --accent: #C98F0A; --on-accent: #141414; --navy: #141414; --on-navy: #FFFFFF; --blue: #8A5A00; --turquoise: #C98F0A;
    --select-bg: #FFF1BF; --select-ink: #141414; --select-dim: #5A4A12;
    --ok: #12724A; --ok-bg: #E4F3EA; --hold: #8F5F00; --hold-bg: #FFF0D2; --danger: #B3322A; --danger-bg: #FBE7E4;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--sidebar-bg); color: var(--sidebar-text);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(145deg, var(--blue), var(--turquoise));
  }
  .brand h1 { font-size: .95rem; font-weight: 700; margin: 0; color: #fff; letter-spacing: -0.01em; }
  .brand .subtitle { font-size: .68rem; color: var(--sidebar-text-dim); font-family: 'IBM Plex Mono', monospace; }
  .nav-label {
    font-family: 'IBM Plex Mono', monospace; font-size: .64rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--sidebar-text-dim); padding: 0 10px; margin-bottom: 2px;
  }
  .project-nav { display: flex; flex-direction: column; gap: 2px; }
  .project-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--sidebar-text);
    border: none; background: none; width: 100%; text-align: left;
  }
  .project-item:hover { background: rgba(255,255,255,.05); }
  .project-item.active { background: var(--sidebar-active); color: #fff; }
  .project-item .p-icon { font-size: 1rem; flex-shrink: 0; }
  .project-item .p-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-item .p-count {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem; background: rgba(255,255,255,.12);
    color: #fff; border-radius: 20px; padding: 1px 7px; min-width: 18px; text-align: center;
  }
  .project-item.active .p-count { background: var(--accent); color: var(--on-accent); }
  .project-item.nav-child {
    padding-left: 36px; font-weight: 600; font-size: .84rem;
    color: #fff;
  }
  .project-item.nav-child .p-icon { font-size: 1.05rem; }
  .sidebar-footnote { margin-top: auto; font-size: .68rem; color: var(--sidebar-text-dim); padding: 0 8px; line-height: 1.5; }
  .toolbar[hidden] { display: none; }
  #moduleView { overflow-x: auto; }
  .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .mod-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
  .mod-card h3 { margin: 0 0 6px; font-size: .8rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .mod-card .big { font-size: 1.5rem; font-weight: 700; }
  #moduleView h3 { font-size: .85rem; margin: 14px 0 6px; }
  .mod-table { width: 100%; border-collapse: collapse; font-size: .78rem; margin-bottom: 14px; }
  .mod-table th, .mod-table td { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  .mod-table th { color: var(--text-dim); font-weight: 600; }
  .tq-card, .tq-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--surface); }
  .tq-q { font-weight: 600; margin-bottom: 4px; }
  .tq-title a { font-weight: 600; }
  .tq-meta { font-size: .75rem; color: var(--text-dim); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .tq-units { display: flex; flex-wrap: wrap; gap: 4px; }
  .tq-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .tq-actions .tq-note { flex: 1 1 200px; min-width: 0; }
  .tq-unit { max-width: 100%; margin: 4px 0; }
  .mod-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .72rem; border: 1px solid var(--border); }
  .mod-tag.ok { color: var(--ok); border-color: var(--ok); }
  .mod-tag.bad { color: var(--danger); border-color: var(--danger); }
  .mod-note { font-size: .78rem; color: var(--text-dim); margin: 0 0 12px; }
  .health-chip { margin-top: auto; margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--sidebar-text-dim); font-size: .72rem; line-height: 1.4; color: var(--sidebar-text-dim); }
  .health-chip + .sidebar-footnote { margin-top: 0; }
  .health-chip button { all: unset; cursor: pointer; display: block; width: 100%; }
  .health-chip .h-title { font-weight: 600; }
  .health-chip.ok { color: var(--ok); border-color: var(--ok); }
  .health-chip.alert { color: var(--danger); border-color: var(--danger); }
  .health-chip ul { margin: 6px 0 0; padding-left: 16px; display: none; }
  .health-chip.open ul { display: block; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .main { padding: 22px 24px 48px; max-width: 780px; min-width: 0; }
  .main.bible-mode { max-width: 920px; }
  .main-header { margin-bottom: 16px; }
  .main-header h2 { font-size: 1.15rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .main-header .main-sub { font-size: .8rem; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
  .pillbar { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .pill {
    font: inherit; font-weight: 600; font-size: .82rem; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .pill.active { background: var(--navy); color: var(--on-navy); border-color: transparent; }
  .pill .p-count {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem;
    background: rgba(0,0,0,.08); border-radius: 20px; padding: 1px 7px;
  }
  .pill.active .p-count { background: rgba(255,255,255,.25); }
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 18px; font-size: .82rem; color: var(--text-dim); box-shadow: var(--shadow);
  }
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; transition: opacity .35s ease, transform .35s ease;
  }
  .card.leaving { opacity: 0; transform: scale(.97); }
  .card.in-production { border-left: 3px solid var(--ok); }
  .card.in-done { border-left: 3px solid var(--turquoise); opacity: .92; }
  .card.in-trash { border-left: 3px solid var(--danger); opacity: .8; }
  .card.in-hold { border-left: 3px solid var(--hold); }
  .card-meta {
    display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem; color: var(--text-faint); margin-bottom: 8px; flex-wrap: wrap;
  }
  .pub-pill { background: var(--surface-2); color: var(--text-dim); border-radius: 20px; padding: 2px 9px; font-weight: 600; }
  .status-pill { border-radius: 20px; padding: 2px 9px; font-weight: 600; }
  .status-pill.production { background: var(--ok-bg); color: var(--ok); }
  .status-pill.done { background: #E6F7FA; color: #0B6B7A; }
  .status-pill.trash { background: var(--danger-bg); color: var(--danger); }
  .status-pill.hold { background: var(--hold-bg); color: var(--hold); }
  .card-title { font-size: .95rem; font-weight: 600; line-height: 1.35; margin: 0 0 3px; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--blue); text-decoration: underline; }
  .original-title { font-size: .72rem; color: var(--text-faint); font-style: italic; margin: 0 0 8px; line-height: 1.4; }
  .gist {
    font-size: .87rem; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px;
    padding-left: 10px; border-left: 2px solid var(--turquoise);
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .78rem; font-weight: 600; border-radius: 8px; padding: 7px 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-promote { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .btn-delete { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .btn-undo { background: var(--surface); color: var(--blue); }
  .btn-hold { background: var(--hold-bg); color: var(--hold); border-color: transparent; }
  .btn-sync { background: var(--navy); color: var(--on-navy); border-color: transparent; }
  .empty {
    text-align: center; color: var(--text-faint); font-size: .85rem; padding: 30px 10px;
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%) translateY(20px); background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    font-size: .82rem; font-weight: 600; padding: 10px 18px; border-radius: 30px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footnote {
    margin-top: 26px; font-size: .74rem; color: var(--text-faint); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  @media (max-width: 720px) {
    .health-chip { display: none; }
    .app { grid-template-columns: 1fr; }
    .sidebar { flex-direction: row; align-items: center; overflow-x: auto; padding: 12px; gap: 14px; }
    .brand .subtitle, .nav-label, .sidebar-footnote { display: none; }
    .project-nav { flex-direction: row; gap: 6px; }
    .project-item { white-space: nowrap; }
    .main { padding: 16px 16px 40px; }
  }
  .src-link{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .src-link:hover{color:var(--accent,#39b8d4)}
  #srcPanel{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(128,128,128,.3);border-radius:12px}
  #srcPanel h3{margin:10px 0 6px;font-size:14px}
  #srcPanel .src-scroll{max-height:340px;overflow:auto}
  #srcPanel table{border-collapse:collapse;width:100%;font-size:13px}
  #srcPanel th,#srcPanel td{padding:4px 8px;border-bottom:1px solid rgba(128,128,128,.2);vertical-align:top}
  #srcPanel th{font-size:11px;font-weight:600;text-align:left;opacity:.7;position:sticky;top:0;background:var(--surface,#fff)}
  #srcPanel tr[data-src]{cursor:pointer}
  #srcPanel tr[data-src]:hover{background:rgba(128,128,128,.12)}
  #srcPanel .src-n{text-align:right;white-space:nowrap;opacity:.8}
  #srcPanel .src-bad{color:var(--danger,#e5584b)}
  #srcPanel .src-reval-warn{color:#b45309;font-size:12px}
  #srcPanel .src-reval-ok{opacity:.4}
  #srcPanel .src-chip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(57,184,212,.18);cursor:pointer}
  #srcPanel .src-n2{color:var(--text-faint,#8A9BA8);font-weight:600}
  #srcPanel .src-name{font-weight:600}
  #srcPanel .src-why{font-weight:400;color:var(--text-dim,#52697A)}
  .hek-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  .hek-bar select{padding:6px 8px;border-radius:8px;border:1px solid var(--border,#ccc);background:transparent;color:inherit;max-width:100%}
  .hek-bar .btn[disabled]{opacity:.45;cursor:not-allowed}
  .bulk-pick{display:block;font-size:12px;opacity:.75;margin-bottom:4px}
  .hek-health{margin:0 0 12px;font-size:13px}
  .hek-health table{border-collapse:collapse;width:100%;margin-top:6px}
  .hek-health td{padding:3px 8px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:top}
  .project-item.nav-doc .p-count { display: none; }
  .project-nav .nav-label.nav-group { margin-top: 10px; }
  .project-nav .nav-label.nav-group:first-child { margin-top: 0; }
  /* Each group (Time Sensitive, Evergreen, Sistem Modülleri) and Bible stand apart with a divider; all headings share one style. */
  .project-nav .nav-label.nav-group:not(:first-child) { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--sidebar-border, rgba(255,255,255,.12)); }
  .project-nav .nav-sep { height: 16px; margin-top: 8px; border-top: 1px solid var(--sidebar-border, rgba(255,255,255,.12)); }
  .ev-pill { background: rgba(57,184,212,.14); color: var(--text-dim); border-radius: 20px; padding: 2px 9px; font-weight: 600; }
  .bible-doc { font-size: .92rem; line-height: 1.65; color: var(--text); }
  .bible-doc h1 { font-size: 1.4rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  .bible-doc h2 { font-size: 1.12rem; margin: 1.7em 0 .5em; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
  .bible-doc h3 { font-size: 1rem; margin: 1.3em 0 .4em; }
  .bible-doc h4 { font-size: .92rem; margin: 1.1em 0 .3em; }
  .bible-doc p, .bible-doc li { color: var(--text-dim); }
  .bible-doc strong { color: var(--text); }
  .bible-doc a { color: var(--blue); }
  .bible-doc hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
  .bible-doc blockquote {
    margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--turquoise);
    background: var(--surface); color: var(--text-dim);
  }
  .bible-doc pre, .bible-doc code { font-family: 'IBM Plex Mono', monospace; }
  .bible-doc pre {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow: auto; font-size: .76rem; line-height: 1.5;
  }
  .bible-doc :not(pre) > code {
    background: var(--surface-2); border-radius: 4px; padding: 1px 5px; font-size: .8em;
  }
  .bible-doc table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: 12px 0 18px; }
  .bible-doc th, .bible-doc td { border: 1px solid var(--border); padding: 7px 9px; vertical-align: top; }
  .bible-doc th { background: var(--surface-2); text-align: left; color: var(--text); }
  .bible-raw { font-size: .78rem; margin-top: 18px; }
  .bible-meta {
    margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface); font-size: .8rem; color: var(--text-dim);
  }
  .bible-meta b { color: var(--text); }
  .bible-meta .spf-tracks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .bible-meta .spf-chip {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem;
    background: var(--surface-2); border-radius: 999px; padding: 3px 8px;
  }
  .bible-meta table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .74rem; }
  .bible-meta td, .bible-meta th { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; }

  #rejectDialog { border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(420px, 92vw); }
  #rejectDialog::backdrop { background: rgba(0,0,0,.45); }
  #rejectDialog form { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  #rejectDialog h3 { margin: 0 0 4px; font-size: .95rem; }
  #rejectDialog label { font-size: .78rem; color: var(--text-dim); }
  #rejectDialog select, #rejectDialog input { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: .82rem; }
  #rejectDialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  /* ===== Editorial layer (2026-10-23): three-column triage, Newsreader + Instrument Sans ===== */
  .main { padding: 0; max-width: none; }
  .work { display: block; }
  .pane-list { padding: 22px 18px 40px; min-width: 0; }
  .main > #bibleView, .main > #moduleView, .main > .footnote { padding: 0 28px; max-width: 960px; }
  .main:not(.split) .pane-list { padding: 24px 28px 8px; max-width: 960px; }
  .main > .footnote { margin: 24px 0 0; padding: 14px 28px 48px; border-top: 1px solid var(--border); }
  .main.split > .footnote { display: none; }

  .sidebar { gap: 16px; }
  .brand-mark { display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 1.1rem var(--font-serif); border-radius: 8px; }
  .brand h1 { font-family: var(--font-serif); font-size: 1.05rem; letter-spacing: .04em; }
  .project-item { font-weight: 500; font-size: .88rem; padding: 9px 10px 9px 12px; border-radius: 8px; transition: background .15s ease, color .15s ease; position: relative; }
  .project-item.active { background: var(--sidebar-active); box-shadow: inset 3px 0 0 var(--accent); color: #fff; }
  .project-item .p-icon { width: 20px; height: 20px; display: inline-grid; place-items: center; opacity: .9; }
  .project-item .p-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .project-item .p-count { background: transparent; color: var(--sidebar-text-dim); padding: 0; font-size: .72rem; }
  .project-item.active .p-count { background: transparent; color: var(--accent); }
  .nav-label { font-size: .62rem; letter-spacing: .12em; }
  .theme-btn { all: unset; cursor: pointer; font: 500 .72rem var(--font-mono); color: var(--sidebar-text-dim); padding: 6px 8px; border: 1px solid var(--sidebar-border); border-radius: 8px; text-align: center; }
  .theme-btn:hover { color: #fff; border-color: var(--sidebar-text-dim); }

  .main-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .main-header h2 { font-family: var(--font-serif); font-size: 2.1rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; margin: 0; }
  .main-header h2 .title-count { font-family: var(--font-mono); font-size: .9rem; font-weight: 500; color: var(--text-faint); letter-spacing: 0; margin-left: 6px; vertical-align: .35em; }
  .main-header .main-sub { flex-basis: 100%; font-size: .72rem; color: var(--text-faint); }
  .toolbar { margin: 10px 0 14px; }
  .btn { font-family: var(--font-ui); border-radius: 8px; transition: background .15s ease, transform .1s ease, border-color .15s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .pill:focus-visible, .project-item:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-sync { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-sync:hover { border-color: var(--text-faint); }
  .density { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

  /* ===== Layout v5 (2026-11-05): top tabs, single decision card, bottom review queue (cream light theme default) ===== */
  :root[data-theme="light"] {
    --bg: #F4EFE6; --surface: #FFFEFA; --surface-2: #EFE9DC;
    --sidebar-bg: #F1EBDF; --sidebar-text: #2B2A26; --sidebar-text-dim: #7A7467; --sidebar-active: #E6EDE2; --sidebar-border: rgba(40,35,20,.12);

    --accent: #0E5C3E; --on-accent: #FFFFFF; --navy: #0E5C3E; --on-navy: #FFFFFF; --blue: #0E5C3E; --turquoise: #0E5C3E;
    --select-bg: #E4EBDD; --select-ink: #1B2A1F; --select-dim: #4E5E50;
    --ok: #0E5C3E; --ok-bg: #E1EEE6; --hold: #8F5F00; --hold-bg: #FFF0D2; --danger: #B3322A; --danger-bg: #FBE7E4;

  :root[data-theme="light"] .project-item:hover { background: rgba(0,0,0,.04); }

  .app { grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 28px; padding: 0 24px; height: 56px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar .brand { padding: 0; min-width: calc(var(--sidebar-w) - 24px); }

  /* single decision card + queue: .pane-list / #listView dissolve into one flex column */

  #listView { display: contents; }

  .main-header h2 { font-size: 1.9rem; }
  .main-header { align-items: center; }
  .toolbar { align-items: center; }
  .toolbar .btn-sync { border-radius: 999px; padding: 8px 16px; font-weight: 600; }
  .density { margin-left: auto; }
  .pillbar { margin-bottom: 18px; }

  .read-inner.read-grid { max-width: none; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 0 28px; padding: 30px 34px 30px; }

  .idx-src { font: 700 .86rem var(--font-ui); color: var(--text); margin-bottom: 4px; }
  .idx-date { font: 500 .78rem var(--font-ui); color: var(--text-dim); margin-bottom: 8px; }
  .read-idx .status-pill { font-size: .72rem; }
  .read-main { min-width: 0; }
  .read-title { font-size: clamp(1.6rem, 2.6vw, 2.35rem); margin: 0 0 10px; }

  .read-more .read-facts { margin-top: 10px; }
  .decision { background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--accent) 14%, var(--border)); border-radius: 14px; padding: 16px 18px 18px; }
  :root[data-theme="dark"] .decision { background: var(--surface-2); }
  .decision-h { font: 700 1.05rem var(--font-serif); margin: 0 0 12px; color: var(--text); }
  .decision .rate { background: none; border: 0; padding: 0; margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
  .decision .rate-h { grid-column: 1 / -1; margin: 0; }
  .decision .rate-l { margin: 0; font-weight: 600; white-space: nowrap; }
  .decision .rate-l kbd, .decision .rate-hint { display: none; }
  .decision .rate-scores, .decision .rate-ch { gap: 4px; }
  .decision .rate .chip { min-width: 28px; height: 26px; padding: 0 6px; font-size: .78rem; border-radius: 6px; background: var(--surface); }
  .decision .rate .chip.ch { padding: 0 10px; font-size: 0; }
  .decision .rate .chip.ch b { font-size: .76rem; }
  .decision .rate-send, .decision .rate-saved { grid-column: 1 / -1; margin: 0; }
  .decision .rate-send .btn { padding: 5px 14px; font-size: .78rem; }
  .decision .read-actions { position: static; background: none; border: 0; padding: 0; margin: 0; gap: 10px; }
  .decision .read-actions .btn { padding: 10px 18px; font-size: .88rem; border-radius: 10px; }
  .decision .read-actions .btn-hold, .decision .read-actions .btn-delete, .decision .read-actions .btn-undo { background: var(--surface); }
  .decision .pred-line { margin: 0 0 12px; background: var(--surface); }
  .read-keys { margin-top: 16px; }

  .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  .queue-head h3 { font: 700 1.2rem var(--font-serif); margin: 0; color: var(--text); }
  .queue-head .progress { margin: 0; }
  .queue-head .progress .bar, .queue-head #progressPos { display: none; }
  .queue-row { display: flex; align-items: stretch; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); }
  .q-nav { all: unset; cursor: pointer; flex: none; align-self: center; padding: 8px 10px; font: 600 .84rem var(--font-ui); color: var(--text-dim); border-radius: 8px; }
  .q-nav:hover { color: var(--text); background: var(--surface-2); }
  .queue-row .card-list { flex: 1; min-width: 0; flex-direction: row; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px; }
  .queue-row .card { flex: 0 0 210px; display: block; padding: 10px 12px 10px 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); scroll-snap-align: start; position: relative; }
  .queue-row .card::after { display: none; }
  .queue-row .card.is-selected { background: var(--select-bg); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); box-shadow: none; }
  .queue-row .card:not(.is-selected):hover { transform: none; box-shadow: none; }
  .queue-row .c-num, .queue-row .card-foot, .queue-row .gist, .queue-row .card-note, .queue-row .original-title, .queue-row .group-sep, .queue-row .card-meta > :not(.pub-pill) { display: none; }
  .queue-row .card-meta { margin: 0 0 3px; }
  .queue-row .pub-pill { font: 700 .8rem var(--font-ui); color: var(--text); }
  .queue-row .card-title { font: 500 .8rem/1.3 var(--font-ui); letter-spacing: 0; -webkit-line-clamp: 2; color: var(--text-dim); }
  .queue-row .card .bulk-pick { left: 12px; top: 12px; }
  .queue-row .card:not(.is-selected) .bulk-pick input { background: var(--surface); }

  @media (max-width: 1100px) {
    .main.split .work { padding: 16px 16px 40px; }
    .read-inner.read-grid { grid-template-columns: 1fr; padding: 20px 20px 22px; }
    .read-idx { border-right: 0; padding: 0 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .idx-n { font-size: 2.2rem; } .idx-t { border: 0; margin: 0; padding: 0; }
  }
  @media (max-width: 720px) {
    .app { grid-template-rows: auto auto 1fr; }
    .topbar { gap: 12px; padding: 0 12px; }
    .topbar .brand { min-width: 0; } .topbar .brand h1 { display: none; }
    .sidebar { position: static; height: auto; border-right: 0; }
  }

  /* ===== Area bands (2026-11-12, owner): Time Sensitive = top bar, Evergreen = left column; dense brand green with light text so they never blend with the news area ===== */
  .topbar { background: #0B4A32; border-bottom: 1px solid rgba(255,255,255,.14); }
  .topbar .brand h1 { color: #F3F7F2; }
  .topbar .brand-mark { background: #F3F7F2; color: #0B4A32; }
  .area-label { font: 600 .62rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: #8FE3B5; border: 1px solid rgba(143,227,181,.45); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .top-tab { color: #B9D2C4; }
  .top-tab:hover { color: #fff; }
  .top-tab.active { color: #fff; border-bottom-color: #8FE3B5; }
  .top-tab .p-count { color: #B9D2C4; }
  .top-tab.active .p-count { color: #fff; }
  .top-tab:focus-visible { outline-color: #8FE3B5; }
  .sidebar { --sidebar-bg: #0B4A32; --sidebar-text: #E8F1EA; --sidebar-text-dim: #A9C7B6; --sidebar-active: rgba(255,255,255,.14); --sidebar-border: rgba(255,255,255,.16); background: #0B4A32; color: #E8F1EA; }
  :root[data-theme] .sidebar .project-item { color: #E8F1EA; }
  :root[data-theme] .sidebar .project-item:hover, :root[data-theme] .sidebar .project-item.active { color: #fff; background: rgba(255,255,255,.14); }
  :root[data-theme] .sidebar .project-item.active { box-shadow: inset 3px 0 0 #8FE3B5; }
  :root[data-theme] .sidebar .project-item .p-count { color: #A9C7B6; }
  :root[data-theme] .sidebar .project-item.active .p-count { color: #fff; }
  .sidebar .nav-label { color: #8FE3B5; }
  .sidebar .theme-btn, .sidebar .sidebar-footnote { color: #A9C7B6; border-color: rgba(255,255,255,.25); }
  .sidebar .project-nav .nav-sep { border-top-color: rgba(255,255,255,.16); }
  /* compact source list */
  #srcPanel { padding: 8px 10px; font-size: 12px; }

  #srcPanel .src-scroll { max-height: 280px; }
  #srcPanel table { font-size: 12px; }
  #srcPanel th, #srcPanel td { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  #srcPanel .src-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #0E5C3E; margin-right: 6px; vertical-align: middle; }
  #srcPanel .src-dot.bad { background: var(--danger, #B3322A); }
  #srcPanel .src-review-toggle, #srcPanel select { font-size: 11px; }

  /* ===== Sorular: system tab set apart at the far right; compact extra questions in the editorial card ===== */
  .top-tabs { flex: 1; }
  .top-tab.system { margin-left: auto; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.28); color: #8FE3B5; }
  .top-tab.system.active { color: #fff; }
  .top-tab .sys-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8FE3B5; margin-right: 8px; }
  .wowx { display: grid; gap: 6px; margin-top: 8px; }
  .wowx .rate-l { margin: 4px 0 0; }
  .wowx .wx-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .wowx .wx-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border: 1px solid var(--border, #E0D9C8); border-radius: 999px; background: var(--surface, #FFFEFA); font-size: .8rem; cursor: pointer; }
  .wowx .wx-chip:has(input:checked) { border-color: var(--accent, #0E5C3E); background: var(--ok-bg, #E1EEE6); }

  .wowx select, .wowx .wx-note { font: inherit; font-size: .82rem; padding: 4px 8px; border: 1px solid var(--border, #E0D9C8); border-radius: 8px; background: var(--surface, #FFFEFA); }
  .wowx .wx-note { flex: 1; min-width: 200px; }

  /* ===== Compact horizontal rating panel; provenance badge; production-line chooser ===== */
  .decision .rate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 8px; }
  .decision .rate-h { flex: 1 1 100%; margin: 0; font-size: .66rem; }
  .decision .rate-l { margin: 0; font-size: .74rem; font-weight: 600; white-space: nowrap; flex: 0 0 auto; }
  .decision .rate-scores, .decision .rate-ch { display: inline-flex; flex-wrap: nowrap; gap: 3px; flex: 0 1 auto; }
  .decision .rate .chip { min-width: 24px; height: 24px; padding: 0 5px; font-size: .74rem; border-radius: 6px; }
  .decision .rate .chip.ch { padding: 0 9px; }
  .decision .rate-scores, .decision .rate-ch { overflow-x: auto; max-width: 100%; }
  .decision .rate-send, .decision .rate-saved { flex: 1 1 100%; margin: 2px 0 0; }
  .decision .rate-send .btn { padding: 4px 12px; font-size: .76rem; }
  .decision .wowx { flex: 1 1 100%; gap: 5px; margin-top: 4px; }
  .decision .wowx .rate-l { display: inline-block; margin-right: 6px; }
  .prov-badge { display: inline-block; margin: 0 0 8px; padding: 3px 11px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 .74rem var(--font-mono); letter-spacing: .03em; }
  .prodpick-back { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(15,22,18,.5); }
  .prodpick { min-width: 280px; max-width: 92vw; padding: 20px 22px; border-radius: 14px; background: var(--surface, #FFFEFA); color: var(--text, #1E1A12); box-shadow: 0 12px 40px rgba(0,0,0,.3); display: grid; gap: 10px; }

  .prodpick .wx-chip:has(input:checked) { border-color: var(--accent, #0E5C3E); background: var(--ok-bg, #E1EEE6); }

  /* ===== Production rail (owner 2026-11-12): green column on the right, under Sorular; three Instagram channel lines ===== */
  .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 210px; }
  .prodrail { grid-column: 3; grid-row: 2; background: #0B4A32; color: #E8F1EA; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow-y: auto; }

  .prodrail .rail-item.active { box-shadow: inset -3px 0 0 #8FE3B5; }

  @media (max-width: 1100px) { .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); } .prodrail { grid-column: 1 / -1; grid-row: auto; position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 14px; } .prodrail .rail-note { display: none; } }
  @media (max-width: 720px) { .app { grid-template-columns: 1fr; } }

  .read-idx .idx-wow { margin-top: 6px; font: 700 .78rem var(--font-mono); color: var(--accent); letter-spacing: .03em; }
  .read-idx .idx-doc { margin-top: 2px; font: 600 .8rem var(--font-ui); color: var(--text-dim); }

  /**

   * number (e.g. both showed "137 aktif kaynak"). See
   * apps/hub/route-counts.test.mjs for the regression test.
   */
  function computeActiveSourceCount(state, bursCatalog, egitimCatalog) {
    // Evergreen views share kaduse routes with the Time Sensitive lanes; their feed count would be misleading.
    if (state.temporal === 'EVERGREEN') return null;
    if (state.route === 'tip_toplulugu' && state.hekSources) {
      if (state.hekLane === 'burs') {
        return bursCatalog.length || state.hekSources.filter(function (s) { return sourceFamily(s) === 'burs'; }).length;

      if (state.hekLane === 'egitim') {

      }

  /** Alphabetical (Turkish collation); "Diğer" stays last as the catch-all. */
  function fillRejectReasons(select) {
    if (select.options.length) return;
    var list = REJECT_REASONS.filter(function (r) { return r[0] !== 'other'; })
      .sort(function (x, y) { return x[1].localeCompare(y[1], 'tr'); })
      .concat(REJECT_REASONS.filter(function (r) { return r[0] === 'other'; }));

  }
  /** Resolves {reasonCode, reasonNote} or null if the operator cancels. Every

  function promptRejectReason() {
    return new Promise(function (resolve) {

      var select = document.getElementById('rejectReasonCode');
      var note = document.getElementById('rejectReasonNote');
      fillRejectReasons(select);
      select.value = 'off_topic';
      note.value = '';
      function onCancel() { cleanup(); resolve(null); }
      function onSubmit(e) {
        e.preventDefault();
        var reasonCode = select.value;
        var reasonNote = note.value.trim();
        cleanup();
        dlg.close();
        resolve({ reasonCode: reasonCode, reasonNote: reasonNote || null });
      }
      function cleanup() {
        document.getElementById('rejectCancelBtn').removeEventListener('click', onCancel);
        dlg.querySelector('form').removeEventListener('submit', onSubmit);
      }
      document.getElementById('rejectCancelBtn').addEventListener('click', onCancel);

  async function handleAction(action, id) {

    }
    var wqIt = state.items.find(function (x) { return x.id === id; });
    if (wqIt && wqIt.wowq) {
      if (action === 'wowskip') { await skipWowQuestion(wqIt); }

        var wd = draftFor(wqIt.id);

        if (!wch) return;

      } else { showToast('Bu ekranda yalnız puan, sorular, “Üretime aktar” ve “Şimdilik geç” var.'); }
      return;
    }
    var feedback = null;
    if (action === 'delete') {
      feedback = await promptRejectReason();
      if (!feedback) return; // operator cancelled -- no state change, no partial reject
    }
    var items = visibleItems();
    var idx = items.findIndex(function (x) { return x.id === id; });
    var nextId = idx >= 0 ? ((items[idx + 1] || items[idx - 1] || {}).id || null) : null;
    var body = { itemId: id, action: action };
    if (prodChannels) body.channels = prodChannels;
    if (action === 'complete' && state.route === 'prodline') body.channel = state.prodCh;
    if (feedback) { body.reasonCode = feedback.reasonCode; body.reasonNote = feedback.reasonNote; }
    // Optimistic: the card leaves the list at once (no wait for the server round trip + full reload).
    var snapshot = state.items;
    state.items = state.items.filter(function (x) { return x.id !== id; });
    delete state.selected[id];
    state.cursor = action === 'undo' ? id : nextId;
    renderList();
    var result;
    try { result = await api('/api/triage', { method: 'POST', body: JSON.stringify(body) }); }
    catch (err) { state.items = snapshot; state.cursor = id; renderList(); throw err; }
    if (action === 'promote' || action === 'hold' || action === 'delete') bumpProcessed();
    if (action === 'promote' || action === 'complete') refreshProdCounts();

      action === 'promote' ? '✓ Üretime aktarıldı: ' + prodChannels.map(function (c) { return PROD_LABEL[c]; }).join(' + ') + ' hattı — approved_brief üretildi' :
      action === 'hold' ? 'Beklemeye alındı' :

    var undoable = action === 'hold' || action === 'delete';
    state.lastUndo = undoable ? { id: id, at: Date.now() } : null;
    showToast(msg, undoable ? { id: id, label: 'Geri al' } : null);

  // Sürüklenebilir genişlik: menü. Değer tarayıcıda saklanır; çift tık varsayılana döner; klavye okları 16 px oynatır.
  (function initResizers() {
    var root = document.documentElement;
    var DEF = { '--sidebar-w': 248 };
    function px(name) { return parseInt(getComputedStyle(root).getPropertyValue(name), 10) || DEF[name]; }
    function clampTo(name, v) {
      var min = 200, max = 360;
      return Math.max(min, Math.min(max, Math.round(v)));
    }
    function setW(name, v, save) {
      var w = clampTo(name, v);
      root.style.setProperty(name, w + 'px');
      if (save) { try { localStorage.setItem('gcos' + name, String(w)); } catch (e) { /* private mode */ } }
      return w;
    }
    try {
      ['--sidebar-w'].forEach(function (n) { var v = parseInt(localStorage.getItem('gcos' + n) || '', 10); if (v) setW(n, v, false); });
    } catch (e) { /* private mode */ }
    function bind(el, name) {
      if (!el) return;
      var startX = 0, startW = 0;
      el.addEventListener('pointerdown', function (e) {
        startX = e.clientX; startW = px(name);
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging'); document.body.classList.add('resizing');
      });
      el.addEventListener('pointermove', function (e) {
        if (!el.classList.contains('dragging')) return;
        setW(name, startW + (e.clientX - startX), false);
      });
      function end(e) {
        if (!el.classList.contains('dragging')) return;
        el.classList.remove('dragging'); document.body.classList.remove('resizing');
        setW(name, px(name), true);
      }
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('dblclick', function () { setW(name, DEF[name], true); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { setW(name, px(name) + (e.key === 'ArrowRight' ? 16 : -16), true); e.preventDefault(); }
      });
    }
    bind(document.getElementById('resizeSide'), '--sidebar-w');
  })();

  // Klavye ile sıralı triyaj. Üretime aktarma kalıcı bir yan etki (approved_brief) üretir: ikinci tuş vuruşu ister.
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var dlg = document.getElementById('rejectDialog');
    if (dlg && dlg.open) return;
    if (state.route === 'bible' || state.route === 'modules') return;
    var k = String(e.key || '').toLowerCase();
    var items = visibleItems();
    if (!items.length) return;
    var idx = items.findIndex(function (x) { return x.id === state.cursor; });
    if (idx < 0) idx = 0;
    var cur = items[idx];
    function fail(err) { showToast(err.message); }
    var curRate = state.ratingsReady !== false;
    if (curRate && /^[0-9]$/.test(k)) {
      var dd = draftFor(cur.id);
      state.drafts[cur.id] = { wow: k === '0' ? 10 : Number(k), tt: dd.tt, ik: dd.ik, km: dd.km };
      renderRateBlock(cur.id);
      e.preventDefault();
      return;
    }
    if (curRate && (k === 't' || k === 'i' || k === 'm' || k === 'İ')) {
      var dk = draftFor(cur.id);
      var map = { t: 'tt', i: 'ik', 'İ': 'ik', m: 'km' };
      var nk = { wow: dk.wow, tt: dk.tt, ik: dk.ik, km: dk.km };
      nk[map[k]] = !nk[map[k]];
      state.drafts[cur.id] = nk;
      renderRateBlock(cur.id);
      e.preventDefault();
      return;
    }
    if (curRate && k === 'enter' && !(t && t.closest && t.closest('a, button'))) { sendRating(cur.id).catch(fail); e.preventDefault(); return; }
    if (k === 'j' || k === 'arrowdown') { selectItem(items[Math.min(idx + 1, items.length - 1)].id); e.preventDefault(); }
    else if (k === 'k' || k === 'arrowup') { selectItem(items[Math.max(idx - 1, 0)].id); e.preventDefault(); }
    else if (k === 'o') { var u = safeHttpUrl(cur.canonicalUrl); if (u) window.open(u, '_blank', 'noopener,noreferrer'); }
    else if (k === 'z') { if (state.lastUndo && Date.now() - state.lastUndo.at < 60000) undoLast(state.lastUndo.id).catch(fail); }
    else if (k === 'b' && cur.triageStatus === 'inbox') { handleAction('hold', cur.id).catch(fail); }
    else if (k === 's' && (cur.triageStatus === 'inbox' || cur.triageStatus === 'hold')) { handleAction('delete', cur.id).catch(fail); }
    else if (k === 'e' && (cur.triageStatus === 'inbox' || cur.triageStatus === 'hold')) {
      if (state.armed && state.armed.id === cur.id && Date.now() - state.armed.at < 3000) { state.armed = null; handleAction('promote', cur.id).catch(fail); }
      else { state.armed = { id: cur.id, at: Date.now() }; showToast('Üretime aktarmak için E tuşuna tekrar basın'); }
    }
  });

  var themeBtn = document.getElementById('themeBtn');
  function syncThemeBtn() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    themeBtn.textContent = light ? 'Tema: açık · koyuya geç' : 'Tema: koyu · açığa geç';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('gcos-theme', next); } catch (err) { /* private mode */ }
    syncThemeBtn();
  });
  syncThemeBtn();

  // Sistem sağlığı: GET /api/health/watch (Hub operatör anahtarı ile; salt okunur). Sessizce başarısız olur, Hub'ı bozmaz.
  var healthChip = document.getElementById('healthChip');
  function renderHealth(report) {
    var alerts = report.alerts || [];
    healthChip.hidden = false;
    healthChip.classList.toggle('ok', alerts.length === 0);
    healthChip.classList.toggle('alert', alerts.length > 0);
    document.getElementById('healthTitle').textContent = alerts.length === 0 ? 'Sistem sağlığı: sağlıklı' : 'Sistem sağlığı: ' + alerts.length + ' uyarı';
    document.getElementById('healthSub').textContent = ' · ' + new Date(report.utc).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    var list = document.getElementById('healthList');
    list.innerHTML = '';
    alerts.forEach(function (a) {
      var li = document.createElement('li');
      li.textContent = a.name + ': ' + a.detail;
      list.appendChild(li);
    });
  }
  function renderHealthMessage(text) {
    healthChip.hidden = false;
    healthChip.classList.remove('ok', 'alert');
    document.getElementById('healthTitle').textContent = 'Sistem sağlığı';
    document.getElementById('healthSub').textContent = ' · ' + text;
    document.getElementById('healthList').innerHTML = '';
  }
  async function refreshHealth() {
    var token = localStorage.getItem(OPERATOR_TOKEN_KEY);
    if (!token) { renderHealthMessage('operatör anahtarı gerekli'); return; }
    try {
      var res = await fetch('/api/health/watch', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) { renderHealthMessage('okunamadı (' + res.status + ')'); return; }
      renderHealth(await res.json());
    } catch (e) { renderHealthMessage('okunamadı'); }
  }
  document.getElementById('healthBtn').addEventListener('click', function () {
    var open = healthChip.classList.toggle('open');
    document.getElementById('healthBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  refreshHealth();
  setInterval(refreshHealth, 15 * 60 * 1000);

  load().catch(function (err) {
    showToast('API hazır değil: ' + err.message);
    renderChrome();
  });
})();
</script>
</body>
</html>
