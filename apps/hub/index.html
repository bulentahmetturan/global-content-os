<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-2: #EDF1F4;
    --sidebar-bg: #0B2233;
    --sidebar-text: #C9DAE3;
    --sidebar-text-dim: #7C93A1;
    --sidebar-active: #14344A;
    --border: #DCE3E8;
    --text: #0B2233;
    --text-dim: #52697A;
    --text-faint: #8A9BA8;
    --navy: #0B3654;
    --blue: #1178BB;
    --turquoise: #35BCD1;
    --ok: #1A8754;
    --ok-bg: #E7F6ED;
    --hold: #A9720A;
    --hold-bg: #FFF3DF;
    --danger: #C4392B;
    --danger-bg: #FBEAE8;
    --shadow: 0 1px 2px rgba(11,34,51,.06), 0 4px 14px rgba(11,34,51,.05);
    --radius: 12px;
    --sidebar-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1620; --surface: #10202E; --surface-2: #14293A; --sidebar-bg: #060F17;
      --sidebar-text: #C9DAE3; --sidebar-text-dim: #607585; --sidebar-active: #14293A;
      --border: #223A4A; --text: #E9F1F5; --text-dim: #9DB4C2; --text-faint: #6C8494;
      --navy: #35BCD1; --blue: #4FC3E8; --turquoise: #35BCD1; --ok: #4ADE94; --ok-bg: #123424;
      --hold: #F5C265; --hold-bg: #3A2A0C; --danger: #FF7A6B; --danger-bg: #3A1815;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--sidebar-bg); color: var(--sidebar-text);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(145deg, var(--blue), var(--turquoise));
  }
  .brand h1 { font-size: .95rem; font-weight: 700; margin: 0; color: #fff; letter-spacing: -0.01em; }
  .brand .subtitle { font-size: .68rem; color: var(--sidebar-text-dim); font-family: 'IBM Plex Mono', monospace; }
  .nav-label {
    font-family: 'IBM Plex Mono', monospace; font-size: .64rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--sidebar-text-dim); padding: 0 10px; margin-bottom: 2px;
  }
  .project-nav { display: flex; flex-direction: column; gap: 2px; }
  .project-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--sidebar-text);
    border: none; background: none; width: 100%; text-align: left;
  }
  .project-item:hover { background: rgba(255,255,255,.05); }
  .project-item.active { background: var(--sidebar-active); color: #fff; }
  .project-item .p-icon { font-size: 1rem; flex-shrink: 0; }
  .project-item .p-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-item .p-count {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem; background: rgba(255,255,255,.12);
    color: #fff; border-radius: 20px; padding: 1px 7px; min-width: 18px; text-align: center;
  }
  .project-item.active .p-count { background: var(--turquoise); color: #06222b; }
  .sidebar-footnote { margin-top: auto; font-size: .68rem; color: var(--sidebar-text-dim); padding: 0 8px; line-height: 1.5; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .main { padding: 22px 24px 48px; max-width: 780px; }
  .main-header { margin-bottom: 16px; }
  .main-header h2 { font-size: 1.15rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .main-header .main-sub { font-size: .8rem; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
  .pillbar { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .pill {
    font: inherit; font-weight: 600; font-size: .82rem; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .pill.active { background: var(--navy); color: #fff; border-color: transparent; }
  .pill .p-count {
    font-family: 'IBM Plex Mono', monospace; font-size: .68rem;
    background: rgba(0,0,0,.08); border-radius: 20px; padding: 1px 7px;
  }
  .pill.active .p-count { background: rgba(255,255,255,.25); }
  .lane-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 18px; font-size: .82rem; color: var(--text-dim); box-shadow: var(--shadow);
  }
  .lane-note b { color: var(--text); }
  .lane-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turquoise); margin-top: 6px; flex-shrink: 0; }
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; transition: opacity .35s ease, transform .35s ease;
  }
  .card.leaving { opacity: 0; transform: scale(.97); }
  .card.in-production { border-left: 3px solid var(--ok); }
  .card.in-done { border-left: 3px solid var(--turquoise); opacity: .92; }
  .card.in-trash { border-left: 3px solid var(--danger); opacity: .8; }
  .card.in-hold { border-left: 3px solid var(--hold); }
  .card-meta {
    display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem; color: var(--text-faint); margin-bottom: 8px; flex-wrap: wrap;
  }
  .pub-pill { background: var(--surface-2); color: var(--text-dim); border-radius: 20px; padding: 2px 9px; font-weight: 600; }
  .status-pill { border-radius: 20px; padding: 2px 9px; font-weight: 600; }
  .status-pill.production { background: var(--ok-bg); color: var(--ok); }
  .status-pill.done { background: #E6F7FA; color: #0B6B7A; }
  .status-pill.trash { background: var(--danger-bg); color: var(--danger); }
  .status-pill.hold { background: var(--hold-bg); color: var(--hold); }
  .card-title { font-size: .95rem; font-weight: 600; line-height: 1.35; margin: 0 0 3px; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--blue); text-decoration: underline; }
  .original-title { font-size: .72rem; color: var(--text-faint); font-style: italic; margin: 0 0 8px; line-height: 1.4; }
  .gist {
    font-size: .87rem; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px;
    padding-left: 10px; border-left: 2px solid var(--turquoise);
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .78rem; font-weight: 600; border-radius: 8px; padding: 7px 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-promote { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .btn-delete { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .btn-undo { background: var(--surface); color: var(--blue); }
  .btn-hold { background: var(--hold-bg); color: var(--hold); border-color: transparent; }
  .btn-sync { background: var(--navy); color: #fff; border-color: transparent; }
  .empty {
    text-align: center; color: var(--text-faint); font-size: .85rem; padding: 30px 10px;
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff;
    font-size: .82rem; font-weight: 600; padding: 10px 18px; border-radius: 30px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footnote {
    margin-top: 26px; font-size: .74rem; color: var(--text-faint); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { flex-direction: row; align-items: center; overflow-x: auto; padding: 12px; gap: 14px; }
    .brand .subtitle, .nav-label, .sidebar-footnote { display: none; }
    .project-nav { flex-direction: row; gap: 6px; }
    .project-item { white-space: nowrap; }
    .main { padding: 16px 16px 40px; }
  }
  .src-link{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .src-link:hover{color:var(--accent,#39b8d4)}
  #srcPanel{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(128,128,128,.3);border-radius:12px}
  #srcPanel h3{margin:10px 0 6px;font-size:14px}
  #srcPanel .src-scroll{max-height:340px;overflow:auto}
  #srcPanel table{border-collapse:collapse;width:100%;font-size:13px}
  #srcPanel td{padding:4px 8px;border-bottom:1px solid rgba(128,128,128,.2);vertical-align:top}
  #srcPanel tr[data-src]{cursor:pointer}
  #srcPanel tr[data-src]:hover{background:rgba(128,128,128,.12)}
  #srcPanel .src-n{text-align:right;white-space:nowrap;opacity:.8}
  #srcPanel .src-bad{color:var(--danger,#e5584b)}
  #srcPanel .src-chip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(57,184,212,.18);cursor:pointer}
  #srcPanel .src-n2{color:var(--text-faint,#8A9BA8);font-weight:600}
  #srcPanel .src-name{font-weight:600}
  #srcPanel .src-why{font-weight:400;color:var(--text-dim,#52697A)}
  .hek-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  .hek-bar select{padding:6px 8px;border-radius:8px;border:1px solid var(--border,#ccc);background:transparent;color:inherit;max-width:100%}
  .hek-bar .btn[disabled]{opacity:.45;cursor:not-allowed}
  .bulk-pick{display:block;font-size:12px;opacity:.75;margin-bottom:4px}
  .hek-health{margin:0 0 12px;font-size:13px}
  .hek-health table{border-collapse:collapse;width:100%;margin-top:6px}
  .hek-health td{padding:3px 8px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:top}
</style>

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function stripHtml(s) {
    var t = String(s == null ? '' : s);
    t = t.replace(/<[^>]+>/g, ' ');
    t = t.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
      .replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#(\d+);/g, function (_, n) {
        return String.fromCharCode(Number(n));
      }).replace(/&#x([0-9a-f]+);/gi, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      });
    return t.replace(/\s+/g, ' ').trim();
  }

  /** Calendar-day age vs today (local). "bugün" / "1 gün" / "N gün". Recalculated on every render. */
  function formatNewsAge(iso, fallbackIso) {
    var raw = iso || fallbackIso;
    if (!raw) return '';
    var d = new Date(raw);
    if (isNaN(d.getTime())) {
      if (fallbackIso && fallbackIso !== iso) return formatNewsAge(fallbackIso, null);
      return '';
    }
    var now = new Date();
    var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var startNews = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var days = Math.round((startToday - startNews) / 86400000);
    // Absurd / broken source dates (e.g. Google News epoch junk) → fallback or hide
    if (days > 800 || days < -30) {
      if (fallbackIso && fallbackIso !== iso) return formatNewsAge(fallbackIso, null);
      return '';
    }
    if (days < 0) days = 0;
    if (days === 0) return 'bugün';
    if (days === 1) return '1 gün';
    return days + ' gün';
  }

  function showToast(msg) {

  }

    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function cardHtml(it) {
    var mode = it.triageStatus;
    var extra = mode === 'production' ? ' in-production'
      : mode === 'done' ? ' in-done'
      : mode === 'trash' ? ' in-trash'
      : mode === 'hold' ? ' in-hold' : '';
    var statusPill = mode === 'production'
      ? '<span class="status-pill production">✓ üretimde</span>'
      : mode === 'done' ? '<span class="status-pill done">🏁 üretim bitti</span>'
      : mode === 'trash' ? '<span class="status-pill trash">✕ silindi</span>'
      : mode === 'hold' ? '<span class="status-pill hold">⏳ beklemede</span>' : '';
    var actions;
    if (mode === 'inbox') {
      actions =
        '<button class="btn btn-promote" data-action="promote" data-id="' + it.id + '">✓ Üretime Aktar</button>' +
        '<button class="btn btn-hold" data-action="hold" data-id="' + it.id + '">⏳ Beklet</button>' +
        '<button class="btn btn-delete" data-action="delete" data-id="' + it.id + '">✕ Sil</button>';
    } else if (mode === 'hold') {
      actions =
        '<button class="btn btn-promote" data-action="promote" data-id="' + it.id + '">✓ Üretime Aktar</button>' +
        '<button class="btn btn-delete" data-action="delete" data-id="' + it.id + '">✕ Sil</button>';
    } else if (mode === 'production') {
      actions =
        '<button class="btn btn-promote" data-action="complete" data-id="' + it.id + '">✓ Üretim Bitti</button>';
    } else {
      actions = '<button class="btn btn-undo" data-action="undo" data-id="' + it.id + '">↩ Geri Al</button>';
    }
    var gist = stripHtml((it.gists && it.gists[0]) || it.summary || '');
    var title = stripHtml(it.title || '');
    var titleOrig = stripHtml(it.titleOrig || '');
    var evidence = '';
    if (it.evidence && (it.evidence.doi || it.evidence.pmid)) {
      evidence = '<p class="original-title">Kanıt: ' +
        (it.evidence.doi ? 'DOI ' + escapeHtml(it.evidence.doi) + ' ' : '') +
        (it.evidence.pmid ? 'PMID ' + escapeHtml(it.evidence.pmid) : '') + '</p>';
    }
    var ageLabel = formatNewsAge(it.publishedAt, it.fetchedAt);
    var enrichNote = '';
    if (it.enrichmentStatus === 'pending' || it.enrichmentStatus === 'failed') {
      enrichNote = '<p class="original-title">Öz hazırlanıyor…</p>';

    return (
      '<div class="card' + extra + '" id="card-' + it.id + '">' +
        (state.route === 'hekimler' && (mode === 'inbox' || mode === 'hold')
          ? '<label class="bulk-pick"><input type="checkbox" data-pick="' + it.id + '"' + (state.selected[it.id] ? ' checked' : '') + '> seç</label>' : '') +

        (ageLabel
          ? '<span class="news-age" title="' + escapeHtml(it.publishedAt || it.fetchedAt || '') + '">' +
            escapeHtml(ageLabel) + '</span>'
          : '') + statusPill + '</div>' +
        '<p class="card-title"><a href="' + escapeHtml(it.canonicalUrl) + '" target="_blank" rel="noopener">' +
          escapeHtml(title) + '</a></p>' +
        (titleOrig && titleOrig !== title
          ? '<p class="original-title">Orijinal: ' + escapeHtml(titleOrig) + '</p>' : '') +

        '<p class="gist">' + escapeHtml(gist) + '</p>' +

        rows.push({
          id: f.id, name: f.label, route: f.route,
          status: bad ? 'hata: ' + f.last_error : (f.last_fetched_at ? 'çalışıyor' : 'henüz çekilmedi'), bad: bad,
          last: f.last_fetched_at ? String(f.last_fetched_at).slice(0, 10) : '', n: (typeof f.inbox_count === 'number' ? f.inbox_count : counts[f.id]) || 0,
          research: f.route === 'kaduse-research'
        });
      });
    }
    return rows;
  }
  function renderSourcePanel() {
    var el = document.getElementById('srcPanel');
    if (!state.showSources) { el.hidden = true; return; }
    el.hidden = false;
    var rows = sourceRows();
    if (!rows.length) { el.innerHTML = 'Kaynaklar yükleniyor…'; return; }
    function table(list) {
      return '<div class="src-scroll"><table><tbody>' + list.map(function (r, i) {
        var why = sourceWhy(r.id);
        var nameCell = '<span class="src-n2">' + (i + 1) + '.</span> <span class="src-name">' + escapeHtml(baseSourceName(r.name)) + '</span>' +
          (why ? ' <span class="src-why">: ' + escapeHtml(why) + '</span>' : '');
        return '<tr data-src="' + escapeHtml(r.id) + '" data-kind-of="' + escapeHtml(r.route || '') + '"><td>' + nameCell + '</td><td class="' + (r.bad ? 'src-bad' : '') + '">' +
          escapeHtml(shortLabel(r.status)) + '</td><td>' + escapeHtml(r.last) + '</td><td class="src-n">' + r.n + ' kayıt</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    var news = rows.filter(function (r) { return !r.research; }), res = rows.filter(function (r) { return r.research; });
    var filt = state.sourceFilter ? '<span class="src-chip" data-src-clear="1">filtre: ' + escapeHtml(state.sourceFilter) + ' ✕</span>' : '';
    el.innerHTML = '<b>' + rows.length + ' kaynak</b> · satıra tıklayınca liste o kaynağa süzülür ' + filt +
      '<h3>📰 ' + (state.route === 'kaduse' ? 'Haber' : 'Haber / duyuru') + ' (' + news.length + ')</h3>' + (news.length ? table(news) : '<div>Yok</div>') +
      '<h3>🔬 ' + (state.route === 'kaduse' ? 'Araştırma' : 'Araştırma / veri') + ' (' + res.length + ')</h3>' + (res.length ? table(res) : '<div>Yok</div>');
  }
  async function ensureFeeds() {
    if (state.route === 'hekimler' || state.feedsByRoute[state.route]) return;
    if (state.route === 'kaduse') {
      var both = await Promise.all([api('/api/feeds?route=kaduse-news'), api('/api/feeds?route=kaduse-research')]);
      state.feedsByRoute.kaduse = (both[0].feeds || []).concat(both[1].feeds || []);
      return;
    }
    var d = await api('/api/feeds?route=' + encodeURIComponent(state.route));
    state.feedsByRoute[state.route] = d.feeds || [];
  }

  var COVERAGE_TR = {
    PIPELINE_OK: 'Tam', PIPELINE_OK_EMPTY: 'Çalışıyor, içerik yok', PIPELINE_OK_LIMITED: 'Sınırlı kapsam',
    PARTIALLY_COVERED: 'Kısmen kapsanıyor', RUNNER_REQUIRED: 'Türkiye runner gerekli',
    FAILED_INTERNAL: 'Hata', NOT_RUN: 'Çalışmadı'
  };
  function visibleItems() {
    return state.items.filter(function (it) { return !state.sourceFilter || it.sourceId === state.sourceFilter || it.feedId === state.sourceFilter; });
  }
  function renderToolbar() {
    var el = document.getElementById('hekToolbar');
    if (state.route !== 'hekimler') { el.hidden = true; return; }
    el.hidden = false;
    var ids = {};
    state.items.forEach(function (it) { if (it.sourceId) ids[it.sourceId] = (ids[it.sourceId] || 0) + 1; });
    var opts = '<option value="">Tüm kaynaklar (' + state.items.length + ')</option>' + Object.keys(ids).sort().map(function (id) {
      return '<option value="' + escapeHtml(id) + '"' + (state.sourceFilter === id ? ' selected' : '') + '>' +
        escapeHtml(SOURCE_LABELS[id] || id.replace(/_/g, ' ')) + ' (' + ids[id] + ')</option>';
    }).join('');
    var n = Object.keys(state.selected).length;
    var health = '';
    if (state.hekSources) {
      health = '<details class="hek-health"><summary>Kaynak durumu (' + state.hekSources.length + ')</summary><table><tbody>' +
        state.hekSources.map(function (s) {
          return '<tr><td>' + escapeHtml(SOURCE_LABELS[s.sourceId] || s.sourceId) + '</td><td>' + escapeHtml(COVERAGE_TR[s.label] || s.label) +
            '</td><td>' + escapeHtml(s.note || '') + '</td></tr>';
        }).join('') + '</tbody></table></details>';
    }
    el.innerHTML = '<div class="hek-bar"><select id="hekSourceFilter">' + opts + '</select>' +
      (state.view === 'inbox' || state.view === 'hold'
        ? '<button class="btn btn-hold" data-bulk="hold"' + (n ? '' : ' disabled') + '>⏳ Seçilenleri beklet (' + n + ')</button>' +
          '<button class="btn btn-delete" data-bulk="delete"' + (n ? '' : ' disabled') + '>✕ Seçilenleri sil (' + n + ')</button>' : '') +
      '</div>' + health;
  }
  function renderList() {
    var items = visibleItems();
    cardListEl.innerHTML = items.map(cardHtml).join('');
    emptyStateEl.hidden = items.length > 0;
    if (!items.length) {
      var inboxN = (state.counts && state.counts.inbox) || 0;
      emptyStateEl.innerHTML = state.view !== 'inbox' && inboxN
        ? 'Bu kutuda öğe yok. <a href="#" data-view="inbox">Gelen Kutusu’nda ' + inboxN + ' öğe var →</a>'
        : 'Bu kutuda öğe yok.';
    }
    renderToolbar();
    renderSourcePanel();
  }

  async function refreshRouteCounts() {
    var data = await api('/api/routes');
    state.routeCounts = {};
    state.routeMeta = {};
    (data.routes || []).forEach(function (r) {
      state.routeCounts[r.id] = r.counts;
      state.routeMeta[r.id] = r;
    });
  }

  async function load() {
    renderChrome();
    var days = state.route === 'tip-ogrencileri' ? 2 : 14;
    var limit = state.route === 'tip-ogrencileri' ? 100 : 200;
    var data = await api(itemsQuery(backendRoute(), state.view, days, limit));
    state.counts = data.counts || state.counts;
    state.items = data.items || [];
    state.selected = {};
    if (state.showSources) { try { await ensureFeeds(); } catch (e) { /* panel shows loading */ } }
    if (state.route === 'hekimler' && !state.hekSources) {
      try { state.hekSources = (await api('/api/hekimler/sources')).sources || []; } catch (e) { state.hekSources = null; }
    }
    await refreshRouteCounts();
    renderChrome();
    renderList();
  }

  async function handleAction(action, id) {
    var card = document.getElementById('card-' + id);
    if (card) card.classList.add('leaving');
    await new Promise(function (r) { setTimeout(r, 180); });
    var result = await api('/api/triage', {
      method: 'POST',
      body: JSON.stringify({ itemId: id, action: action })
    });
    var msg =
      action === 'promote' ? '✓ Üretime aktarıldı — approved_brief üretildi' :
      action === 'hold' ? '⏳ Beklemede’ye alındı' :
      action === 'complete' ? '✓ Üretim bitti — Üretimi Bitenler’e taşındı (2 gün sonra kalıcı silinir)' :
      action === 'delete' ? 'Silindi — 2 gün sonra kalıcı silinir' : 'Gelen Kutusu’na taşındı';
    if (result.brief) msg += ' (' + result.brief.briefId + ')';
    showToast(msg);
    await load();
  }

  async function handleBulk(action) {
    var ids = Object.keys(state.selected);
    if (!ids.length) return;
    var ok = 0, failed = [];
    for (var i = 0; i < ids.length; i++) {
      try { await api('/api/triage', { method: 'POST', body: JSON.stringify({ itemId: ids[i], action: action }) }); ok++; }
      catch (e) { failed.push(ids[i] + ': ' + e.message); }
    }
    showToast((action === 'hold' ? 'Beklemeye alındı: ' : 'Silindi: ') + ok + '/' + ids.length + (failed.length ? ' · hata: ' + failed[0] : ''));
    await load();
  }
  document.addEventListener('change', function (e) {
    if (e.target.id === 'hekSourceFilter') { state.sourceFilter = e.target.value; renderList(); return; }
    var pick = e.target.getAttribute && e.target.getAttribute('data-pick');
    if (pick) { if (e.target.checked) state.selected[pick] = true; else delete state.selected[pick]; renderToolbar(); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-srcpanel]')) {
      state.showSources = !state.showSources;
      renderChrome();
      ensureFeeds().catch(function () {}).then(function () { renderSourcePanel(); });
      return;
    }
    var kindBtn = e.target.closest('[data-kind]');
    if (kindBtn) {
      state.kind = kindBtn.getAttribute('data-kind');
      state.sourceFilter = '';
      localStorage.setItem('gcos-kind', state.kind);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var srcRow = e.target.closest('[data-src]');
    if (srcRow) {
      var want = srcRow.getAttribute('data-kind-of');
      var wantKind = want === 'kaduse-research' ? 'research' : want === 'kaduse-news' ? 'news' : null;
      state.sourceFilter = srcRow.getAttribute('data-src');
      if (state.route === 'kaduse' && wantKind && wantKind !== state.kind) {
        state.kind = wantKind;
        localStorage.setItem('gcos-kind', state.kind);
        load().catch(function (err) { showToast(err.message); });
        return;
      }
      renderList(); renderChrome(); return;
    }
    if (e.target.closest('[data-src-clear]')) { state.sourceFilter = ''; renderList(); renderChrome(); return; }
    var bulkBtn = e.target.closest('[data-bulk]');
    if (bulkBtn) { handleBulk(bulkBtn.getAttribute('data-bulk')).catch(function (err) { showToast(err.message); }); return; }
    var routeBtn = e.target.closest('[data-route]');
    if (routeBtn) {
      state.route = routeBtn.getAttribute('data-route');
      state.view = 'inbox';
      state.sourceFilter = '';
      state.showSources = false;
      localStorage.setItem('gcos-route', state.route);
      localStorage.setItem('gcos-kind', state.kind);
      localStorage.setItem('gcos-view', state.view);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var viewBtn = e.target.closest('[data-view]');
    if (viewBtn) {
      state.view = viewBtn.getAttribute('data-view');
      localStorage.setItem('gcos-view', state.view);
      load().catch(function (err) { showToast(err.message); });
      return;
    }
    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      handleAction(actionBtn.getAttribute('data-action'), actionBtn.getAttribute('data-id'))
        .catch(function (err) { showToast(err.message); });
      return;
    }
  });

  document.getElementById('btnSync').addEventListener('click', function () {
    showToast('Kaynaklar taranıyor… (yaklaşık 30-40 sn sürebilir)');
    var genericRoutes = state.route === 'kaduse' ? ['kaduse-news', 'kaduse-research'] : [state.route];
    var calls = [
      api('/api/ingress/news', { method: 'POST' }),
      api('/api/ingress/research', { method: 'POST' })
    ].concat(genericRoutes.map(function (rt) {
      return api('/api/ingress/generic', { method: 'POST', body: JSON.stringify({ route: rt, offset: 0, limit: 10 }) });
    }));
    Promise.allSettled(calls).then(function (results) {
      var ok = results.filter(function (r) { return r.status === 'fulfilled'; }).length;
      var created = 0;
      (function sum(o) {
        if (!o || typeof o !== 'object') return;
        if (typeof o.created === 'number') created += o.created;
        Object.keys(o).forEach(function (k) { if (o[k] && typeof o[k] === 'object') sum(o[k]); });
      })(results.filter(function (r) { return r.status === 'fulfilled'; }).map(function (r) { return r.value; }));
      showToast('Senkron: ' + ok + '/' + results.length + ' istek tamam · ' + created + ' yeni kayıt (yoksa kaynaklarda yeni içerik yok)');
      return load();
    }).catch(function (err) { showToast(err.message); });
  });

  load().catch(function (err) {
    showToast('API hazır değil: ' + err.message);
    renderChrome();
  });
})();
</script>
</body>
</html>
